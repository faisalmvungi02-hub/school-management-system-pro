name: PLUS OS Quality Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plus-os-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Resolve and lock dependency tree
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Run ESLint
        run: npm run lint

      - name: Check TypeScript
        run: npm run typecheck

      - name: Create production build
        run: npm run build

  edge-functions:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check deployed Edge Functions
        run: |
          deno check --config=supabase/functions/selcom-gateway/deno.json supabase/functions/selcom-gateway/index.ts
          deno check --config=supabase/functions/snippe-gateway/deno.json supabase/functions/snippe-gateway/index.ts
          deno check --config=supabase/functions/platform-gateway-credentials/deno.json supabase/functions/platform-gateway-credentials/index.ts
